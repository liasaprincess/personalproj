<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="A simple HEX color preview tool.">
  <title>HEX Color Tool</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="app">
    <header class="app-header">
      <p class="eyebrow">COLOR UTILITY</p>
      <h1>HEX Color Tool</h1>
      <p class="intro">Enter a HEX color and preview it instantly.</p>
    </header>

    <section class="tool-card" aria-labelledby="tool-title">
      <h2 id="tool-title">Color preview</h2>
      <label for="hex-input">HEX color</label>
      <div class="input-row">
        <input id="hex-input" type="text" value="#6C63FF"
               placeholder="#6C63FF" autocomplete="off"
               spellcheck="false" aria-describedby="input-help">
        <button id="preview-button" type="button">Preview</button>
      </div>
      <p id="input-help" class="help-text">Try a value such as #6C63FF.</p>
      <p id="error-message" class="error-message" role="alert" hidden></p>

      <div class="preview-area">
        <div id="color-preview" class="color-preview" aria-label="Color preview"></div>
        <div class="preview-caption">
          <span class="caption-label">Current color</span>
          <strong id="current-hex">#6C63FF</strong>
        </div>
      </div>
    </section>

    <footer>
      <p>A small, dependency-free JavaScript project.</p>
    </footer>
  </main>
</body>
</html>
